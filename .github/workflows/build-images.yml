name: build-images

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "docker/**"
      - "compose.yaml"
      - ".dockerignore"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-images.yml"
  push:
    branches: [main]
  # A base image accumulates CVEs while the Dockerfile sits untouched, so
  # a path-filtered trigger alone would go permanently quiet.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  lint-dockerfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/web/Dockerfile
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/api/Dockerfile
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/ml.Dockerfile

  images:
    needs: lint-dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            dockerfile: apps/web/Dockerfile
          - app: api
            dockerfile: apps/api/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/avash-${{ matrix.app }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Build locally first. Nothing reaches the registry until the scan
      # and the smoke test have both passed.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: avash-${{ matrix.app }}:ci
          build-args: |
            VITE_PUBLIC_API_BASE_URL=${{ vars.PUBLIC_API_BASE_URL || 'http://localhost:8787' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: avash-${{ matrix.app }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test
        run: |
          set -euo pipefail
          if [ "${{ matrix.app }}" = "api" ]; then
            docker run -d --name smoke -p 8787:8787 \
              -e CORS_ALLOWED_ORIGINS=http://localhost:8080 \
              avash-api:ci
            for _ in $(seq 1 30); do
              curl -fsS http://localhost:8787/health >/dev/null 2>&1 && break
              sleep 1
            done
            curl -fsS http://localhost:8787/health | tee /dev/stderr | grep -q '"status":"ok"'
          else
            docker run -d --name smoke -p 8080:8080 avash-web:ci
            for _ in $(seq 1 30); do
              curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break
              sleep 1
            done
            curl -fsS http://localhost:8080/ | grep -qi '<!doctype html'
            curl -sI http://localhost:8080/ | grep -qi 'content-security-policy'
          fi
          docker rm -f smoke

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_PUBLIC_API_BASE_URL=${{ vars.PUBLIC_API_BASE_URL || 'http://localhost:8787' }}
          cache-from: type=gha
