# Supabase CLI local stack (ADR-014).
#
# `supabase start` runs from `packages/db` — this directory is the CLI's
# conventional workdir (`supabase/config.toml` + `supabase/migrations/`
# alongside it), which is also why `scripts/push-hosted.mjs` already runs
# the CLI from here. Never run the CLI from the repo root; it would look
# for a different, empty `supabase/` directory and apply no migrations.
#
# Start it with `pnpm docker:supabase`, which passes the pinned CLI from
# this package's devDependencies rather than whatever is installed
# globally.
#
# Ports are offset into the 543xx range, matching the Supabase CLI
# convention and deliberately NOT colliding with the ADR-011 `db`
# container on 54322 — the two local databases can run side by side.

project_id = "avash"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Bounds a runaway PostgREST read the same way the hosted project does.
max_rows = 1000

[db]
port = 54329
shadow_port = 54330
# Must match the hosted project's major version, or a migration can pass
# locally and fail on deploy. Verified 2026-08-16 by querying the linked
# project directly (`show server_version` → 17.6), not assumed from the
# dashboard. Re-check after any Supabase platform upgrade.
#
# NOTE: this deliberately does NOT match `POSTGIS_LOCAL_IMAGE`
# (postgis/postgis:15-3.4), which the ADR-011 `db` container still pins to
# Postgres 15. That container is a major version BEHIND the hosted
# project — see docs/docker.md § Parity with Supabase.
major_version = 17

[db.pooler]
enabled = false

[realtime]
# ADR-010 — the blood-inventory ticker subscribes to postgres_changes
# straight from the browser. Without this the ticker silently never
# updates locally, which is exactly the failure this stack exists to
# stop being invisible.
enabled = true

[studio]
enabled = true
port = 54323

# Catches outbound mail locally (sign-up confirmations) instead of
# sending it. Sign-up links are read from the web UI on this port.
# `[inbucket]` is the old name for this section and is deprecated in CLI
# 2.114 — it still works, but warns on every command.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
# The origin GoTrue builds confirmation/recovery links against — the Vite
# dev server, not the API.
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:4173",
  "http://localhost:8080",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# Local only. Skipping confirmation means `pnpm role:grant` can act on an
# account the moment it is created, instead of every test run needing a
# trip through Inbucket. The hosted project keeps confirmation ON — this
# file is never applied to it (`supabase db push` pushes migrations, not
# config).
enable_confirmations = false
double_confirm_changes = true

[analytics]
enabled = false
