project: avash
sourceOfTruth: docs/PROJECT_PLAN.md
language: typescript
frameworks:
  - react
  - hono
rules:
  - id: R1
    description: apps/web is a static SPA (React 18 + Vite). No SSR, no Next.js patterns.
  - id: R2
    description: Secrets never touch the client. Anything without a VITE_PUBLIC_ prefix must never be referenced under apps/web/src; it belongs in apps/api or a GitHub Actions job script.
  - id: R3
    description: One types source. Every shared interface/DTO/zod schema lives in packages/types — never redefined inline in either app.
