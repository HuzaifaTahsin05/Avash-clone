<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>অফলাইন — আভাস</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
          'Noto Sans Bengali', 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: #0b1220;
        color: #f5f7fa;
        text-align: center;
      }
      main {
        max-width: 420px;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }
      p {
        line-height: 1.6;
        color: #b8c2d1;
      }
      .badge {
        display: inline-block;
        margin-bottom: 16px;
        padding: 4px 12px;
        border-radius: 999px;
        background: #0b6e4f;
        color: #f5f7fa;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">অফলাইন / Offline</span>
      <h1>আপনি বর্তমানে অফলাইনে আছেন</h1>
      <p>
        You are currently offline. আভাস (Avash) needs a network connection to
        load fresh data. Reconnect and reload this page to continue.
      </p>
    </main>
  </body>
</html>
